# Local only (ADR 0010). Scrapes the API's request metrics from the OpenTelemetry Collector.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    # Keep job="heach-api" from the Collector instead of renaming it to exported_job.
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
