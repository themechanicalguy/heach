# Runs on the dev host (and in CI's deploy smoke test). Synthetic data only.
# Only Caddy publishes ports; PostgreSQL and Redis are reachable only inside this network.
# Values come from /opt/heach/.env, written by deploy.sh (never committed).
name: heach

services:
  # Edge proxy: the admin image's patched Caddy (apps/admin/Dockerfile) with this folder's
  # Caddyfile, as root to bind 80 and 443. Same binary the container scan checks (SO-03.1).
  caddy:
    image: ${REGISTRY:?}/heach/admin:${IMAGE_TAG:?}
    user: root
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    ports:
      - 80:80 # redirect to HTTPS
      - 443:443 # web, and the API under /api
      - 127.0.0.1:8443:8443 # admin: loopback only, reached through Session Manager
      - 127.0.0.1:9443:9443 # web and API with test sign-in: loopback only (SE-07.23)
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
      # Added by the loopback entry to test sign-in requests; never sent by the public entry.
      TEST_LOGIN_KEY: ${TEST_LOGIN_KEY:-}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, admin, api]
    restart: unless-stopped

  web:
    image: ${REGISTRY:?}/heach/web:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-dev}
      # Accounts and every flow behind them, the Step 2 sample note and test sign-in: dev and
      # test only (FF-01).
      FEATURE_FLAGS: accounts,sample-patient-note
    restart: unless-stopped

  admin:
    image: ${REGISTRY}/heach/admin:${IMAGE_TAG}
    restart: unless-stopped

  # Secrets are read from Parameter Store at start-up (EN-12.1); none are set here. AWS access is
  # the API role's, from ./aws (api-credentials.sh), never the instance role's: KMS data keys
  # (EN-04) and exactly its own parameters. One-off tasks: `run --rm api node dist/db/…`.
  api: &api
    image: ${REGISTRY}/heach/api:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-dev}
      API_PORT: '3001'
      BUILD_VERSION: ${IMAGE_TAG}
      AWS_REGION: ap-south-1
      SECRETS_SOURCE: ${SECRETS_SOURCE:-ssm}
      SSM_PARAMETER_PATH: /heach/dev
      KEY_PROVIDER: ${KEY_PROVIDER:-kms}
      KMS_ALIAS_PREFIX: alias/heach-dev
      LOCAL_KEY_SEED: ${LOCAL_KEY_SEED:-}
      DATA_TLS_CA_FILE: /certs/ca.crt
      FEATURE_FLAGS: accounts,sample-patient-note
      # Partners' return links (identity, payments) point at the public entry.
      WEB_ORIGIN: https://${PUBLIC_HOST:?}
      # OTP and other SMS land in the loopback-only Mailpit inbox below; no real SMS until FU-30.
      SMS_PROVIDER: local
      MAILPIT_API_URL: http://mailpit:8025
      ALERT_TOPIC_ARN: ${ALERT_TOPIC_ARN:-}
      AWS_CONFIG_FILE: /aws/config
      DATABASE_URL: postgresql://heach_app@postgres:5432/heach
      DATABASE_MIGRATOR_URL: postgresql://heach_migrator@postgres:5432/heach
      DATABASE_ADMIN_URL: postgresql://heach@postgres:5432/heach
      REDIS_URL: rediss://redis:6379/0
      # Only for the CI deploy smoke test, which has no Parameter Store; empty on the host.
      DATABASE_PASSWORD: ${DB_APP_PASSWORD:-}
      DATABASE_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-}
      DATABASE_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-}
      REDIS_PASSWORD: ${CI_REDIS_PASSWORD:-}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:-}
      TEST_LOGIN_KEY: ${CI_TEST_LOGIN_KEY:-}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./aws:/aws:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    restart: unless-stopped

  # Reminders, auto-cancel, payouts and notifications (Step 5 D-QUEUE): the API image and settings,
  # without HTTP. The image's health check calls the API's port, which the worker does not open.
  worker:
    <<: *api
    command: ['node', '--import', './dist/telemetry.js', 'dist/jobs/worker.js']
    healthcheck:
      disable: true

  # Inbox for SMS sent on dev (synthetic numbers only): loopback only, read through Session
  # Manager port forwarding (`localhost:8025`), like admin. Messages live in the container and go
  # with each recreate.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - 127.0.0.1:8025:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    # TLS only over TCP (EN-01.1); certificates from make-certs.sh in /opt/heach/certs.
    entrypoint: ['/bin/sh', '/etc/postgresql/pg-tls.sh']
    environment:
      POSTGRES_USER: heach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: heach
    volumes:
      - pg-data:/var/lib/postgresql
      - ./certs:/certs:ro
      - ./db/pg-tls.sh:/etc/postgresql/pg-tls.sh:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heach -d heach']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    # TLS port only (EN-01.1).
    entrypoint: ['/bin/sh', '/usr/local/bin/redis-tls.sh']
    command: ['--requirepass', '${REDIS_PASSWORD:?}', '--appendonly', 'yes']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./certs:/certs:ro
      - ./db/redis-tls.sh:/usr/local/bin/redis-tls.sh:ro
    healthcheck:
      test: ['CMD', 'redis-cli', '--tls', '--cacert', '/certs/ca.crt', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  caddy-data:
  pg-data:
  redis-data:
