# Local development services only. Never used for staging or production.
# Credentials come from .env (git-ignored); see .env.example and docs/local-development.md.
# Ports are bound to 127.0.0.1 so nothing is reachable from other machines on your network.
name: heach

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # TLS only over TCP (EN-01.1); certificates from `pnpm setup` (deploy/dev/make-certs.sh).
    entrypoint: ['/bin/sh', '/etc/postgresql/pg-tls.sh']
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      - pg-data:/var/lib/postgresql
      - ./.certs:/certs:ro
      - ./deploy/dev/db/pg-tls.sh:/etc/postgresql/pg-tls.sh:ro
      - ./deploy/dev/db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    # TLS port only (EN-01.1).
    entrypoint: ['/bin/sh', '/usr/local/bin/redis-tls.sh']
    command: ['--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
      - ./.certs:/certs:ro
      - ./deploy/dev/db/redis-tls.sh:/usr/local/bin/redis-tls.sh:ro
    healthcheck:
      test: ['CMD', 'redis-cli', '--tls', '--cacert', '/certs/ca.crt', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object store (SeaweedFS). Admin credentials come from the AWS_* variables.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - 127.0.0.1:${S3_PORT:-8333}:8333
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 60

  # Creates the local bucket, then exits. Run by `pnpm dev:up` after the store is healthy.
  s3-init:
    image: chrislusf/seaweedfs:4.48
    profiles: ['init']
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    environment:
      BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    # Idempotent: creates the bucket only when it does not exist yet.
    command:
      - >-
        if echo "s3.bucket.list" | weed shell -master=s3:9333 | grep -qw "$$BUCKET";
        then echo "bucket $$BUCKET exists";
        else echo "s3.bucket.create -name $$BUCKET" | weed shell -master=s3:9333;
        fi
    restart: 'no'

  # Catches all outgoing email, and SMS in local mode. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - 127.0.0.1:${SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg-data:
  redis-data:
  s3-data:
