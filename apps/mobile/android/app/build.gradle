apply plugin: 'com.android.application'

// The web app's address is a build setting (MA-02): -PHEACH_SERVER_URL=... or the environment.
def serverUrl = providers.gradleProperty('HEACH_SERVER_URL')
    .orElse(providers.environmentVariable('HEACH_SERVER_URL')).getOrNull()
// Debug builds reach the developer's own `pnpm dev` through `adb reverse` (see package.json).
def debugServerUrl = serverUrl ?: 'http://localhost:3000'
// Hosts of partner pages (identity, payments) that may open inside the app, comma-separated
// (MA-03, MA-06). Every other address outside the server opens in the phone's browser.
def allowNavigation = providers.gradleProperty('HEACH_ALLOW_NAVIGATION')
    .orElse(providers.environmentVariable('HEACH_ALLOW_NAVIGATION')).getOrElse('')
// HEACH links open in the app once Android has verified them against the server (MA-06).
def appLinkHost = serverUrl ? new URI(serverUrl).host : 'localhost'

android {
    namespace = "in.heach"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'ALLOW_NAVIGATION', "\"${allowNavigation}\""
        manifestPlaceholders = [appLinkHost: appLinkHost]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // One project, two apps (MA-01). Names and icons live in src/patient and src/provider.
    flavorDimensions = ['audience']
    productFlavors {
        patient {
            dimension 'audience'
            applicationId 'in.heach.patient'
            buildConfigField 'String', 'START_PATH', '"/"'
        }
        provider {
            dimension 'audience'
            applicationId 'in.heach.provider'
            buildConfigField 'String', 'START_PATH', '"/provider"'
        }
    }
    buildTypes {
        debug {
            // Lets a debug build sit beside the Play build on one phone.
            applicationIdSuffix '.debug'
            buildConfigField 'String', 'SERVER_URL', "\"${debugServerUrl}\""
        }
        release {
            buildConfigField 'String', 'SERVER_URL', "\"${serverUrl ?: ''}\""
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Already in the app through Capacitor; used directly to check the WebView limits its bridge.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// A release build must name an HTTPS server (MA-02); clear-text HTTP exists only in debug.
gradle.taskGraph.whenReady { graph ->
    def release = graph.allTasks.any { it.project == project && it.name.contains('Release') }
    if (release && !(serverUrl ?: '').startsWith('https://')) {
        throw new GradleException('Release builds need HEACH_SERVER_URL set to an https:// address.')
    }
}
