name: Deploy dev

# Deploys main to the AWS dev host after CI passes on main.
# Disabled until the repository variable AWS_DEPLOY_ROLE_ARN is set (see docs/cloud-setup.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: short-lived AWS credentials, no stored keys (EN-12)

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    name: Deploy to dev
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` here: environments need a paid plan on private repos, and they would
    # change the OIDC subject that the AWS role trusts (ref:refs/heads/main).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: AWS credentials via OIDC
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" \
            --role-session-name "gh-${GITHUB_RUN_ID}" --web-identity-token "$token" \
            --duration-seconds 3600 --query Credentials --output json)
          for pair in AWS_ACCESS_KEY_ID:AccessKeyId AWS_SECRET_ACCESS_KEY:SecretAccessKey AWS_SESSION_TOKEN:SessionToken; do
            value=$(echo "$creds" | jq -r ".${pair#*:}")
            echo "::add-mask::$value"
            echo "${pair%%:*}=$value" >> "$GITHUB_ENV"
          done

      - name: Registry and image tag
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "REGISTRY=${account}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build and push ARM images
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker buildx create --use
          for app in web admin api; do
            docker buildx build --platform linux/arm64 -f "apps/$app/Dockerfile" \
              -t "$REGISTRY/heach/$app:$IMAGE_TAG" --push .
          done

      - name: Deploy through SSM
        run: |
          instance=$(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=heach Name=tag:Environment,Values=dev \
              Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          bundle=$(tar -C deploy/dev -czf - . | base64 -w0)
          params=$(jq -n --arg b "$bundle" --arg r "$REGISTRY" --arg t "$IMAGE_TAG" '{commands: [
            "set -euo pipefail",
            "cd /opt/heach",
            ("echo " + $b + " | base64 -d | tar -xzf -"),
            ("bash deploy.sh " + $r + " " + $t)
          ]}')
          id=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "heach dev $IMAGE_TAG" --parameters "$params" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "$instance" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query '{status: Status, output: StandardOutputContent, errors: StandardErrorContent}'
          test "$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query Status --output text)" = Success
