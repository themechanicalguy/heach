name: Deploy dev

# Deploys main to the AWS dev host after CI passes on main: build, scan, deploy through SSM,
# smoke test, and roll back to the previous tag if the deploy or smoke test fails.
# Disabled until the repository variable AWS_DEPLOY_ROLE_ARN is set (see docs/cloud-setup.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: short-lived AWS credentials, no stored keys (EN-12)

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    name: Deploy to dev
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` here: environments need a paid plan on private repos, and they would
    # change the OIDC subject that the AWS role trusts (ref:refs/heads/main).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: AWS credentials via OIDC
        uses: ./.github/actions/aws-oidc
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Registry, image tag and dev host
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "REGISTRY=${account}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          read -r instance ip < <(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=heach Name=tag:Environment,Values=dev \
              Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].[InstanceId,PublicIpAddress]' --output text)
          test "$instance" != None || { echo "::error::No running dev host (asleep? run scripts/dev-wake)"; exit 1; }
          echo "INSTANCE_ID=$instance" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$ip" >> "$GITHUB_ENV"

      # Plain image manifests (no provenance index), so ECR scan on push can scan them.
      - name: Build and push ARM images
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker buildx create --use
          for app in web admin api; do
            # Tags are immutable: a re-run of the same commit reuses the image already pushed.
            if aws ecr describe-images --repository-name "heach/$app" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
              echo "heach/$app:$IMAGE_TAG already in the registry; skipping build"
              continue
            fi
            docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
              -f "apps/$app/Dockerfile" -t "$REGISTRY/heach/$app:$IMAGE_TAG" --push .
          done

      - name: Image scan gate (high and critical findings block the deploy)
        run: |
          blocked=0
          for app in web admin api; do
            aws ecr wait image-scan-complete --repository-name "heach/$app" --image-id "imageTag=$IMAGE_TAG"
            counts=$(aws ecr describe-image-scan-findings --repository-name "heach/$app" \
              --image-id "imageTag=$IMAGE_TAG" --query 'imageScanFindings.findingSeverityCounts' --output json)
            echo "heach/$app: ${counts}"
            serious=$(echo "${counts:-null}" | jq '(.HIGH // 0) + (.CRITICAL // 0)')
            if [ "$serious" -gt 0 ]; then
              echo "::error::heach/$app has $serious high or critical findings"
              blocked=1
            fi
          done
          exit "$blocked"

      - name: Remember the running tag for rollback
        run: |
          out=$(scripts/ssm-run.sh "$INSTANCE_ID" "heach dev read tag" \
            '{"commands":["cat /opt/heach/DEPLOYED_TAG 2>/dev/null || true"]}')
          previous=$(echo "$out" | head -1 | grep -E '^[0-9a-f]{12}$' || true)
          echo "Previous tag: ${previous:-none}"
          echo "PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"

      - name: Deploy through SSM
        id: deploy
        # A failed preflight on the host changes nothing, so there is nothing to roll back; the
        # rollback would also stop at the same preflight and hide the real cause.
        run: |
          status=0
          output=$(scripts/ssm-run.sh "$INSTANCE_ID" "heach dev $IMAGE_TAG" "$(scripts/deploy-params.sh "$REGISTRY" "$IMAGE_TAG")") || status=$?
          echo "$output"
          if [ "$status" -ne 0 ] && grep -q 'Nothing changed\.' <<<"$output"; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Smoke test /healthz and /api/readyz
        id: smoke
        run: scripts/smoke-test.sh "$PUBLIC_IP"

      - name: Roll back to the previous tag
        if: failure() && env.PREVIOUS_TAG != '' && steps.deploy.outputs.unchanged != 'true' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          echo "::warning::Rolling back dev to $PREVIOUS_TAG"
          scripts/ssm-run.sh "$INSTANCE_ID" "heach dev rollback $PREVIOUS_TAG" "$(scripts/deploy-params.sh "$REGISTRY" "$PREVIOUS_TAG")"
          scripts/smoke-test.sh "$PUBLIC_IP"
