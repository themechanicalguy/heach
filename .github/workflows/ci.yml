name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

# Third-party actions are pinned to full commit SHAs so a moved tag cannot change what runs.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: API integration tests
        run: pnpm --filter @heach/api test:e2e
      - name: Generated API types are up to date
        run: pnpm --filter @heach/types check
      - name: Dependency audit (high and critical block the merge)
        run: pnpm audit --prod --audit-level high

  smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heach/web --filter @heach/admin... build
      - name: Install Chromium
        run: pnpm --filter @heach/web exec playwright install --with-deps chromium
      - run: pnpm --filter @heach/web test:e2e
        env:
          CI: true
      - run: pnpm --filter @heach/admin test:e2e
        env:
          CI: true

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t heach-api:ci .
      - name: Image runs as non-root and passes /healthz
        run: |
          docker run -d --name api -p 3001:3001 heach-api:ci
          for i in $(seq 1 20); do curl -fsS localhost:3001/healthz && break; sleep 1; done
          curl -fsS localhost:3001/healthz
          test "$(docker exec api whoami)" = node
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/docs)" = 404
          docker stop api
