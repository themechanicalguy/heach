name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

# Third-party actions are pinned to full commit SHAs so a moved tag cannot change what runs.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base, for the coverage gate
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Real PostgreSQL and Redis over TLS for API integration tests (TS-03, EN-01.1), from the
      # same compose file as local development. `pnpm setup` writes .env with throwaway values.
      - name: Start PostgreSQL and Redis (TLS)
        run: |
          node scripts/setup.mjs
          docker compose up -d --wait postgres redis otel-collector jaeger
      # Local Turborepo cache only; no remote cache service. Restores the newest run for this lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm format:check
      - name: Lint, typecheck, unit tests and build (same as local pnpm check)
        run: pnpm check
      - name: API integration tests (bootstrap and migrations from an empty database, EN-10.1)
        run: pnpm --filter @heach/api test:e2e
      - name: Coverage of changed lines is at least 80 percent (TS-01.1)
        run: |
          cov="--coverage.enabled --coverage.reporter=lcov --coverage.reportsDirectory"
          pnpm -r --filter './apps/*' --filter './packages/*' --filter '!@heach/api' --filter '!@heach/config' \
            exec vitest run $cov=coverage-unit
          (cd apps/api && pnpm exec vitest run $cov=coverage-all)
          node scripts/check-changed-coverage.mjs HEAD^1
      - name: Every column has a data class; Restricted columns are encrypted (DC-01)
        run: pnpm --filter @heach/api db:check-classes
      - name: Storybook builds (UX-01.1); each story passes axe in the ui unit tests (UX-01.2)
        run: pnpm --filter @heach/ui build-storybook
      - name: Generated API types are up to date
        run: pnpm --filter @heach/types check
      # Production and development dependencies alike: a vulnerable dev server or build tool runs
      # on developer machines and CI with access to the source (security review 2026-10-24).
      - name: Dependency audit, all dependencies (high and critical block the merge, SO-03.2)
        run: pnpm audit --audit-level high

  smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heach/web... --filter @heach/admin... build
      - name: Install Chromium
        run: pnpm --filter @heach/web exec playwright install --with-deps chromium
      # Mobile, tablet and desktop (TS-05.1): locale routes, CSP, PWA offline (PF-07.1), visual
      # baselines in or/en/hi (TS-07.1), thumb zone (UX-03.1), fonts (I18N-06.1), bundle budget
      # (PF-02.1) and route splitting (PF-05.1). The API flow runs in the deploy bundle job.
      - run: pnpm --filter @heach/web test:e2e
        env:
          CI: true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-web
          path: apps/web/test-results
          retention-days: 7
      - name: Lighthouse mobile performance 90 or more on the shell (PF-03.1)
        run: |
          export CHROME_PATH="$(cd apps/web && node -e "import('@playwright/test').then(m=>console.log(m.chromium.executablePath()))")"
          pnpm --filter @heach/web lighthouse
        env:
          APP_ENV: test
          # The runner has no user namespace sandbox for Chrome; CI only.
          LHCI_COLLECT__SETTINGS__CHROME_FLAGS: --headless=new --no-sandbox
      - run: pnpm --filter @heach/admin test:e2e
        env:
          CI: true

  # OTP sign-up, setup, roles and sessions in or/en/hi on three viewports, then admin sign-in with
  # TOTP and suspension (AC-01 to AC-05, AD-01, AD-03; FU-29). The local development stack:
  # codes go to Mailpit through the local SMS adapter (decision L-8), so no SMS leaves the runner.
  api-e2e:
    name: API-backed E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_API: 1
      API_ORIGIN: http://localhost:3001
      FEATURE_FLAGS: accounts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL, Redis and Mailpit; schema from an empty database
        run: |
          node scripts/setup.mjs
          docker compose up -d --wait postgres redis mailpit
          pnpm --filter @heach/api... --filter @heach/admin... --filter @heach/web^... build
          pnpm --filter @heach/api db:bootstrap
          pnpm --filter @heach/api db:migrate
      # Turborepo does not pass API_ORIGIN to builds, and the web rewrite to the API is fixed at
      # build time, so the web app is built directly.
      - run: pnpm --filter @heach/web exec next build
      # One runner sends every code, so the per-address caps are raised; the per-number caps stay.
      - name: Start the API and the web app
        run: |
          cd apps/api
          RATE_LIMIT_PER_ADDRESS_PER_MINUTE=100000 RATE_LIMIT_PER_MINUTE=100000 \
          OTP_SENDS_PER_ADDRESS_PER_HOUR=100000 OTP_SENDS_PER_DEVICE_PER_HOUR=100000 \
          OTP_FAILURES_PER_ADDRESS_PER_HOUR=100000 \
            nohup node --env-file=../../.env dist/main.js > ../../api-e2e-api.log 2>&1 &
          cd ../web
          APP_ENV=local nohup pnpm exec next start --port 3000 > ../../api-e2e-web.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3001/readyz && break; sleep 2; done
          for i in $(seq 1 60); do curl -fs http://localhost:3000/healthz && break; sleep 2; done
          curl -fs http://localhost:3001/readyz | grep -q '"postgres":"ok"'
      - name: Install Chromium
        run: pnpm --filter @heach/web exec playwright install --with-deps chromium
      - name: Web sign-up, setup, roles, sessions, linked patients, staff and data rights
        run: |
          mailpit="$(grep '^MAILPIT_API_URL=' .env | cut -d= -f2-)"
          E2E_BASE_URL=http://localhost:3000 E2E_MAILPIT_URL="$mailpit" \
            pnpm --filter @heach/web exec playwright test e2e/sign-in-setup.spec.ts \
            e2e/account-flows.spec.ts
      # Providers and plans are seeded through the API; the patient's steps run in the browser.
      - name: Journeys J1, J3, J4, J7, J8 and J9 in the browser
        run: |
          mailpit="$(grep '^MAILPIT_API_URL=' .env | cut -d= -f2-)"
          E2E_BASE_URL=http://localhost:3000 E2E_MAILPIT_URL="$mailpit" \
            pnpm --filter @heach/web exec playwright test e2e/journeys.spec.ts \
            e2e/onboarding-journey.spec.ts
      # After the web suite: the admin suite opens one of the OTP accounts it made.
      - name: Admin sign-in with TOTP, masked users, suspend, admin accounts, recovery and J5
        run: |
          pnpm --filter @heach/admin exec playwright test e2e/admin-users.spec.ts \
            e2e/admin-accounts.spec.ts e2e/admin-verification.spec.ts
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-api-e2e
          path: |
            apps/web/test-results
            apps/admin/test-results
          retention-days: 7
      # Synthetic data only; the API never logs codes, tokens or personal data (LM-02).
      - name: Logs on failure
        if: failure()
        run: tail -n 200 api-e2e-api.log api-e2e-web.log

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t heach-api:ci .
      # No data stores here: the URLs point nowhere, so /healthz is 200 and /readyz is 503.
      - name: Image runs as non-root, passes /healthz, reports not ready without data stores
        run: |
          bash deploy/dev/make-certs.sh "$RUNNER_TEMP/certs"
          docker run -d --name api -p 3001:3001 \
            -v "$RUNNER_TEMP/certs/ca.crt:/certs/ca.crt:ro" \
            -e APP_ENV=test -e DATA_TLS_CA_FILE=/certs/ca.crt \
            -e KEY_PROVIDER=local -e LOCAL_KEY_SEED="$(openssl rand -hex 32)" \
            -e BLIND_INDEX_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgresql://none@127.0.0.1:1/none \
            -e REDIS_URL=rediss://127.0.0.1:1/0 \
            heach-api:ci
          for i in $(seq 1 20); do curl -fsS localhost:3001/healthz && break; sleep 1; done
          curl -fsS localhost:3001/healthz
          test "$(docker exec api whoami)" = node
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/readyz)" = 503
          docker stop api

  deploy-smoke:
    name: Deploy bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build web, admin and API images
        run: |
          for app in web admin api; do
            docker build -f "apps/$app/Dockerfile" -t "local/heach/$app:ci" .
          done
      - name: Container image scan, high and critical block the PR (SO-03.1)
        run: |
          for app in web admin api; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "local/heach/$app:ci"
          done
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint whoami local/heach/web:ci)" = node
          test "$(docker run --rm --entrypoint whoami local/heach/admin:ci)" = nobody
      - name: No source maps in the web image (LM-03.1, maps go to GlitchTip only)
        run: test -z "$(docker run --rm --entrypoint find local/heach/web:ci /app -name '*.map' -path '*static*')"
      # Same compose file and Caddyfile as the dev host, with throwaway CI-only passwords.
      - name: Start the dev stack behind Caddy
        working-directory: deploy/dev
        run: |
          # No Parameter Store or KMS in CI: secrets via .env and the local key double, APP_ENV test.
          redis_password=$(openssl rand -hex 16)
          test_login_key=$(openssl rand -hex 32)
          {
            echo "REGISTRY=local"
            echo "IMAGE_TAG=ci"
            echo "PUBLIC_HOST=127.0.0.1"
            echo "APP_ENV=test"
            echo "SECRETS_SOURCE=env"
            echo "KEY_PROVIDER=local"
            echo "LOCAL_KEY_SEED=$(openssl rand -hex 32)"
            echo "BLIND_INDEX_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_MIGRATOR_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$redis_password"
            echo "CI_REDIS_PASSWORD=$redis_password"
            # Test sign-in behind the loopback entry's key, as on the dev host (SE-07.23).
            echo "TEST_LOGIN_KEY=$test_login_key"
            echo "CI_TEST_LOGIN_KEY=$test_login_key"
          } > .env
          grep '^POSTGRES_PASSWORD=' .env | sed 's/^POSTGRES_PASSWORD=/DB_ADMIN_PASSWORD=/' >> .env
          bash make-certs.sh certs
          # As on the dev host: certificates root-owned in a directory only root can enter.
          sudo chown -R root:root certs && sudo chmod 700 certs
          docker compose up -d --wait --wait-timeout 180 postgres redis
          docker compose run --rm --no-deps api node dist/db/bootstrap.js
          docker compose run --rm --no-deps api node dist/db/migrate.js
          docker compose up -d
      - name: HTTPS checks through Caddy (self-signed, so -k)
        run: |
          for i in $(seq 1 60); do curl -fsSk https://127.0.0.1/api/readyz && break; sleep 2; done
          curl -fsSk https://127.0.0.1/api/readyz | grep -q '"postgres":"ok"'
          curl -fsSk https://127.0.0.1/or | grep -q 'heach-button'
          curl -fsSk https://127.0.0.1:8443/ | grep -q '<div id="root">'
          curl -fsSk https://127.0.0.1/healthz | grep -q '"status":"ok"'
          curl -sSkI https://127.0.0.1/or | grep -qi '^strict-transport-security'
          curl -sSkI https://127.0.0.1/or | grep -qi "^content-security-policy: .*'nonce-"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5432 || true)" = 000
      - name: Test sign-in only through the loopback entry (SE-07.23)
        run: |
          login() { curl -sk -o /dev/null -w '%{http_code}' -X POST "$1/api/v1/auth/test-login" \
            -H 'content-type: application/json' -H "X-Test-Login-Key: ${2:-}" \
            -d '{"userId":"00000000-0000-4000-8000-000000000001"}'; }
          # The public entry refuses it, even with a guessed key header.
          test "$(login https://127.0.0.1)" = 404
          test "$(login https://127.0.0.1 "$(openssl rand -hex 32)")" = 404
          # The API itself refuses it without the key, behind any proxy.
          test "$(docker compose -f deploy/dev/compose.yml exec -T api wget -qS -O /dev/null \
            --post-data '{"userId":"00000000-0000-4000-8000-000000000001"}' \
            --header 'content-type: application/json' http://127.0.0.1:3001/v1/auth/test-login 2>&1 \
            | grep -o 'HTTP/1.1 [0-9]*' | tail -1)" = 'HTTP/1.1 404'
          # The loopback entry adds the key.
          test "$(login https://127.0.0.1:9443)" = 200
      # The last two curl checks use up this runner's API allowance; the sleep after them covers both.
      - name: Fake tokens and forged forwarding headers still reach the API's 429 (SO-08.10)
        run: bash scripts/rate-limit-check.sh https://127.0.0.1
      - name: Caddy rate limits the API per client IP (SO-08.2)
        run: |
          # /api/healthz skips the API's own throttler, so a 429 here can only come from Caddy.
          codes=$(seq 1 320 | xargs -P 16 -I{} curl -sk -o /dev/null -w '%{http_code}\n' https://127.0.0.1/api/healthz | sort | uniq -c)
          echo "$codes"
          echo "$codes" | grep -q ' 429$'
          echo "$codes" | grep -q ' 200$'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/or)" = 200
          sleep 61
      # The Step 2 exit flow through Caddy, web, API, PostgreSQL and KMS double: an Odia note is
      # encrypted, owner-only and audited (EN-13.1, SE-02.3, I18N-04.1, LM-01.1); session refresh
      # across calls and tabs (SE-07.5, SE-07.7, SE-07.12).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Full-stack E2E against the deploy bundle
        run: |
          pnpm install --frozen-lockfile --filter @heach/web...
          pnpm --filter @heach/web... --filter '!@heach/web' build
          pnpm --filter @heach/web exec playwright install --with-deps chromium
          pnpm --filter @heach/web exec playwright test e2e/notes-flow.spec.ts e2e/session-refresh.spec.ts e2e/home.spec.ts
        env:
          CI: true
          E2E_API: 1
          # The loopback entry: the only one that serves test sign-in (SE-07.23).
          E2E_BASE_URL: https://127.0.0.1:9443
      - name: The note is ciphertext in PostgreSQL and its reads are audited
        working-directory: deploy/dev
        run: |
          sql() { docker compose exec -T postgres sh -c "PGPASSWORD=\"\$POSTGRES_PASSWORD\" psql -U heach -d heach -Atc \"$1\""; }
          test "$(sql "select count(*) > 0 from app.patient_note where body->>'algorithm' = 'AES-256-GCM'")" = t
          ! sql "select body::text from app.patient_note" | grep -q 'ମୁଣ୍ଡ'
          test "$(sql "select count(*) > 0 from audit.entry where action = 'sample_note.create'")" = t
          test "$(sql "select count(*) > 0 from audit.entry where action = 'sample_note.list'")" = t
          test "$(sql 'select audit.verify_chain() is null')" = t
          ! docker compose logs api | grep -q 'ମୁଣ୍ଡ'
      - name: PostgreSQL and Redis refuse plaintext inside the network (EN-01.1)
        working-directory: deploy/dev
        run: |
          docker compose exec -T postgres sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql "host=postgres user=heach dbname=heach sslmode=disable" -c "select 1"' 2>&1 | grep -q 'no encryption'
          ! docker compose exec -T redis redis-cli -h redis ping
      - name: Logs on failure
        if: failure()
        working-directory: deploy/dev
        run: docker compose logs --no-color | tail -200

  infra:
    name: Infra (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra
      - name: Every stack carries the Project, Environment and Owner tags
        run: node scripts/check-tags.mjs
      - name: KMS on buckets and disks, key rotation, host KMS actions, API role boundary (EN-02.1, EN-05.2, EN-04.2, EN-12.4)
        run: node scripts/check-infra-security.mjs
      # No AWS credentials: backends are skipped; providers come from the committed lock files.
      - name: Validate every stack
        run: |
          for dir in infra/bootstrap infra/github-oidc infra/paid-plan-budgets infra/envs/*/; do
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$dir" validate
          done

  security:
    name: Static analysis and scanner fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Semgrep CE (D4): registry packs plus HEACH rules; any ERROR finding blocks (SO-03.1).
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan --metrics=off --config p/typescript --config p/nodejs --config p/react \
              --config security/semgrep/heach.yml --severity ERROR --error --quiet
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Each scanner must fail on a planted high finding (made at run time, never committed).
      - name: Every scanner blocks its fixture (SO-03.1, EN-12.3)
        run: |
          gitleaks=$(grep -o 'zricethezav/gitleaks:[^ ]*' .github/workflows/ci.yml | head -1)
          bash scripts/security/scanner-fixtures.sh semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa "$gitleaks"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false
      - name: gitleaks (whole history, findings redacted)
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint sh \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo && gitleaks git --redact --no-banner --exit-code 1 /repo'
