name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

# Third-party actions are pinned to full commit SHAs so a moved tag cannot change what runs.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real PostgreSQL and Redis for API integration tests (TS-03). CI-only throwaway credentials.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: heach_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: heach_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U heach_ci -d heach_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.8.3-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://heach_ci:ci-only-not-a-secret@localhost:5432/heach_ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local Turborepo cache only; no remote cache service. Restores the newest run for this lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm format:check
      - name: Lint, typecheck, unit tests and build (same as local pnpm check)
        run: pnpm check
      - name: API integration tests
        run: pnpm --filter @heach/api test:e2e
      - name: Generated API types are up to date
        run: pnpm --filter @heach/types check
      - name: Dependency audit (high and critical block the merge)
        run: pnpm audit --prod --audit-level high

  smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heach/web --filter @heach/admin... build
      - name: Install Chromium
        run: pnpm --filter @heach/web exec playwright install --with-deps chromium
      - run: pnpm --filter @heach/web test:e2e
        env:
          CI: true
      - run: pnpm --filter @heach/admin test:e2e
        env:
          CI: true

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t heach-api:ci .
      # No data stores here: the URLs point nowhere, so /healthz is 200 and /readyz is 503.
      - name: Image runs as non-root, passes /healthz, reports not ready without data stores
        run: |
          docker run -d --name api -p 3001:3001 \
            -e DATABASE_URL=postgresql://none@127.0.0.1:1/none \
            -e REDIS_URL=redis://127.0.0.1:1/0 \
            heach-api:ci
          for i in $(seq 1 20); do curl -fsS localhost:3001/healthz && break; sleep 1; done
          curl -fsS localhost:3001/healthz
          test "$(docker exec api whoami)" = node
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/readyz)" = 503
          docker stop api

  deploy-smoke:
    name: Deploy bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build web, admin and API images
        run: |
          for app in web admin api; do
            docker build -f "apps/$app/Dockerfile" -t "local/heach/$app:ci" .
          done
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint whoami local/heach/web:ci)" = node
          test "$(docker run --rm --entrypoint whoami local/heach/admin:ci)" = nobody
      # Same compose file and Caddyfile as the dev host, with throwaway CI-only passwords.
      - name: Start the dev stack behind Caddy
        working-directory: deploy/dev
        run: |
          {
            echo "REGISTRY=local"
            echo "IMAGE_TAG=ci"
            echo "PUBLIC_HOST=127.0.0.1"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          docker compose up -d --wait --wait-timeout 180 postgres redis
          docker compose up -d
      - name: HTTPS checks through Caddy (self-signed, so -k)
        run: |
          for i in $(seq 1 60); do curl -fsSk https://127.0.0.1:9443/readyz && break; sleep 2; done
          curl -fsSk https://127.0.0.1:9443/readyz | grep -q '"postgres":"ok"'
          curl -fsSk https://127.0.0.1/ | grep -q 'heach-button'
          curl -fsSk https://127.0.0.1:8443/ | grep -q '<div id="root">'
          curl -fsSk https://127.0.0.1/healthz | grep -q '"status":"ok"'
          curl -sSkI https://127.0.0.1/ | grep -qi '^strict-transport-security'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5432 || true)" = 000
      - name: Logs on failure
        if: failure()
        working-directory: deploy/dev
        run: docker compose logs --no-color | tail -200

  infra:
    name: Infra (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra
      # No AWS credentials: backends are skipped; providers come from the committed lock files.
      - name: Validate every stack
        run: |
          for dir in infra/bootstrap infra/github-oidc infra/envs/*/; do
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$dir" validate
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false
      - name: gitleaks (whole history, findings redacted)
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint sh \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo && gitleaks git --redact --no-banner --exit-code 1 /repo'
